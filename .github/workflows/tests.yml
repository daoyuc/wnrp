name: tests

# 目的：把「本地手跑」的 unittest 变成三平台门禁。
# 背景（2026-09-28）：此前 CI 只构建安装包、从不跑测试，于是 6 个 Windows 失败
# 与 5 个错误（brew symlink 权限、ps 采样断言、sendmail_path 未跳过等）长期无人发现，
# 一次「主窗口启动即崩」也因此漏到用户手里。
#
# 触发：推送、PR、手动。手动跑：Actions → tests → Run workflow。
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: unittest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows runner 默认控制台常是 cp1252；开发脚本 print 中文时若不强制 UTF-8
    # 会 UnicodeEncodeError，把「校验其实已通过」打成步骤失败（见 _docs_cli --check）。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false          # 一个平台挂了也要看到另外两个平台的结果
      matrix:
        # macos-14 在本仓库会落到不受支持的 macos-14-arm64-us-default，秒级 cancelled；
        # macos-latest 由 GitHub 解析到当前可用镜像。
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Linux 上的 tkinter 需要额外包；装不上也不致命 --
      # tests/test_main_window_smoke.py 在无 Tk 环境下会自行跳过
      - name: Install tkinter (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

      # docs/CLI.md 由 cli.py 的 argparse 结构生成（tests/test_docs.py 亦会校验）
      - name: Check docs/CLI.md is up to date
        run: python _docs_cli.py --check

      # i18n 覆盖率守护：四语言扫描缺失已清零（第三十轮），阈值 0 挡住任何新漏译
      - name: i18n coverage guard
        run: python _i18n_scan.py --fail-under=0
